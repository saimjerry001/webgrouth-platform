<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Create account · ARDigitalAssets</title>
<meta name="description" content="Design preview of the ARDigitalAssets token website.">
<meta name="theme-color" content="#FAF9F5">
<link rel="icon" href="/demo/ardigitalassets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/demo/ardigitalassets/style.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<script src="/demo/ardigitalassets/sprite.js"></script>
<main class="auth">
<aside class="auth-side">
  <a class="logo" href="/demo/ardigitalassets/" aria-label="ARDigitalAssets home"><svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true"><path class="hex" d="M24 3l18 10.5v21L24 45 6 34.5v-21z" fill="none" stroke="#D97757" stroke-width="3.2" stroke-linejoin="round"/><path class="a" d="M15 33l9-19 9 19M18.8 26h10.4" fill="none" stroke="#141413" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>AR<b>Digital</b>Assets</span></a>
  <div class="stage" data-tilt><div class="glow"></div><div class="orbit orbit-1"><div class="spin"><i></i></div></div><div class="orbit orbit-2"><div class="spin"><i></i></div></div><div class="coin-wrap"><div class="coin" data-coin></div></div></div>
  <div class="auth-quote"><h2>Your ARD, all in one place.</h2><p>Track your holdings, follow the roadmap and get every update first.</p></div>
</aside>
<div class="auth-main"><div class="auth-card" data-rv="up">
  <div class="mobile-logo"><a class="logo" href="/demo/ardigitalassets/" aria-label="ARDigitalAssets home"><svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true"><path class="hex" d="M24 3l18 10.5v21L24 45 6 34.5v-21z" fill="none" stroke="#D97757" stroke-width="3.2" stroke-linejoin="round"/><path class="a" d="M15 33l9-19 9 19M18.8 26h10.4" fill="none" stroke="#141413" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>AR<b>Digital</b>Assets</span></a></div>
  <h1>Create your account</h1><p>Free forever. Track your ARD and get updates first.</p>
  <form data-auth>
    <div class="field"><label for="nm">Full name</label><input id="nm" type="text" placeholder="Your name" required autocomplete="name"></div>
    <div class="field"><label for="em2">Email</label><input id="em2" type="email" placeholder="you@example.com" required autocomplete="email"></div>
    <div class="field"><label for="ct">Country</label><select id="ct"><option>United States</option><option>United Kingdom</option><option>United Arab Emirates</option><option>Pakistan</option><option>Germany</option><option>Other</option></select></div>
    <div class="field"><label for="pw2">Password</label><div class="pw"><input id="pw2" type="password" placeholder="At least 8 characters" required autocomplete="new-password" data-strength><button type="button" data-pw-toggle>Show</button></div><div class="meter"><i data-meter></i></div><small data-meter-txt style="color:#66655E;font-size:.8rem">Too short</small></div>
    <div class="field"><label for="rf">Referral code (optional)</label><input id="rf" type="text" placeholder="e.g. ARD-1234"></div>
    <div class="row-between"><label class="check"><input type="checkbox" required> I agree to the <a class="link" href="#">Terms</a> and <a class="link" href="#">Privacy policy</a></label></div>
    <button class="btn btn-clay" type="submit">Create account</button>
  </form>
  <p style="margin-top:22px;text-align:center">Already have an account? <a class="link" href="/demo/ardigitalassets/login.html">Log in</a></p>
</div></div>
</main>
<script src="/demo/ardigitalassets/app.js"></script>
</body>
</html>
